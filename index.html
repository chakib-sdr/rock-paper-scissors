<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors.css">
</head>
<body>
    <div class="content">
    <header>
        <h1>Rock-Paper-Scissors</h1>
        <p>Best Hand Wins The Rounds</p>
    </header>
    <div class="score">
        <div id="you" class="elementscore">
            <p>You</p>
            <p id="playerscore" class="number">0</p>
            <div class="playercontainer">

            </div>
        </div>
        <div class="vs">
            <h1>Vs</h1>
        </div>
        <div id="computer" class="elementscore">
            <p>computer</p>
            <p id="computerscore" class="number">0</p>
            <div class="computercontainer">

             </div>
        </div>
    </div>

    <div class="choices">
        <div class="btn">
    <button class="rock" > <img id="rock" src="right-facing-fist-svgrepo-com.svg" alt="rock"></button>
    <button class="paper" ><img id="paper" src="hand-with-fingers-splayed-svgrepo-com.svg" alt="paper"></button>
    <button class="scissors" ><img id="scissors" src="victory-hand-svgrepo-com.svg" alt="scissors"></button>
        </div>
        <div class="resetbutton">
        <button class="reset">Reset Game</button>
    </div>
    </div>


    </div>

    <script src="rock-paper-scissors.js"></script>
    
</body>
</html>
